##########################################################
## TOPOLOGIC CONFIGURATION FILE — BERTopic backend      ##
##########################################################
#
# Start from this file rather than topologic_config.ini when using the
# bertopic backend. The format is identical -- it is the *values* that differ,
# because bertopic derives topics from sentence embeddings and describes them
# with c-TF-IDF, which wants almost the opposite vocabulary settings from NMF.
#
# What differs from the NMF template, and why:
#
#   number_of_topics   empty, not 100  -- the clustering decides the count
#   max_iter           empty           -- bertopic does not iterate
#   min_freq           5, not 0.1      -- see VECTORIZATION, this is the big one
#   max_features       15000           -- caps an O(vocab^2) step, see below
#   stemmer            no              -- topic labels are shown to humans
#
# Everything not mentioned above behaves exactly as in the NMF template.


[TRAINING_DATA]
# Comma-separated list of text source paths. Each entry is either:
#   - the root of an existing philologic database (detected automatically), or
#   - a directory of raw TEI/plaintext files to be parsed in place.
# For raw input, drop an optional bibliography.tsv/.csv next to (or inside)
# the directory — all columns flow through as metadata. Without a bibliography,
# TEI headers are used. The 'filename' column is required in the bibliography.
text_paths =

# Defines what object level to divide each text into. Useful to break up a single document into smaller text units. If several, use a comma to distinguish each. Must be in same order as the path
text_object_level =

# Minimum tokens per doc for training. If 0 is set, training data will include the entire corpus.
min_tokens_per_doc = 0

# Maximum size of a chunk, in RAW words (not preprocessed tokens -- the two
# differ by roughly 5x). A chunk never spans more than one text object, and a
# large text object is split further, so a small object yields a single chunk
# equal to the object itself. Paragraphs are never split, so a single
# paragraph longer than this becomes an over-size chunk of its own (reported
# at build time).
#
# Leave empty for one chunk per text object, which is the behaviour from
# before chunking existed.
max_chunk_size = 500
# 500 raw words reproduces the granularity of the topical-reading view and is
# a sensible size for embedding: small enough that a chunk is about one thing,
# large enough for a stable vector. It is also capped by what the embedding
# model can encode -- a larger value is clamped, with a warning.


[INFERENCE_DATA]
# Comma-separated list of text source paths (same rules as TRAINING_DATA).
text_paths =

# Optional link to an external Philologic web app to cite from inside the
# TopoLogic UI (one URL per path in text_paths, in order). Leave blank for
# corpora parsed from raw files or when no linked web app exists.
philologic_database_urls =

# Defines what object level to divide each text into. Useful to break up a single document into smaller text units. If several, use a comma to distinguish each. Must be in same order as the path
text_object_level =

# Minimum tokens per doc for inference. If 0 is set, the model will be applied to the entire corpus. If set to above 0, only documents above the threshold will be classified and stored in the databse.
min_tokens_per_doc = 0

# Maximum size of a chunk, in RAW words (not preprocessed tokens -- the two
# differ by roughly 5x). A chunk never spans more than one text object, and a
# large text object is split further, so a small object yields a single chunk
# equal to the object itself. Paragraphs are never split, so a single
# paragraph longer than this becomes an over-size chunk of its own (reported
# at build time).
#
# Leave empty for one chunk per text object, which is the behaviour from
# before chunking existed.
max_chunk_size = 500


[METADATA_FILTERS]
### List one metadata field and one value per line, e.g. author = Rousseau
### The value for the query must use the PhiloLogic metadadata query syntax
### So egrep-style regexes as well as ranges are admissible, as well as NOT or OR queries


[DATABASE]
# Name of database. Must be without spaces. Use underscores to separate words (no hyphens)
database_name =


[PREPROCESSING]
#
# IMPORTANT: with bertopic, preprocessing does NOT affect the clustering.
# Documents are embedded from `raw_paragraphs` — untouched source-language
# text — so everything in this section shapes only the *vocabulary* used to
# label topics via c-TF-IDF, plus the word-similarity tables in the web app.
#
# That inverts one of the usual tradeoffs: aggressive normalization no longer
# buys better topics, it only makes the topic words harder to read.

# Language: set the language for various normalization tasks
# such as stemming, lemmatizing, word mapping...etc
language =

# Language model: specify a Spacy Language model for PoS or NER filtering. See https://spacy.io/models
language_model =

# Modernize language if modernization is available for your language: currently only French is supported.
modernize = yes

# Transliterate characters to closest ascii representation.
# Keep this off: the embedding side never sees these tokens, and stripping
# accents only degrades the displayed topic words.
ascii = no

# Stem words using the Porter Stemmer.
# Off for bertopic. Stems make good NMF features but poor topic labels
# ("libert", "gouvern"), and since stemming cannot improve the clustering here
# it is a pure readability loss. Turn it back on only if the vocabulary is too
# large to fit the max_features budget below.
stemmer = no

# Lemmatizer: path to lemmatizer file where each line contains the inflected form and
# the corresponding lemma separated by a tab.
# A lemmatizer is the better way to consolidate inflections for bertopic:
# it keeps real words, unlike the stemmer.
lemmatizer =

# Lowercase words
lowercase = yes

# Remove numbers
numbers = yes

# Minimum word length
minimum_word_length = 3

# Stopwords: path to stopword list.
# Worth setting for bertopic: function words survive an absolute min_freq
# floor and, unlike with a proportional floor, will reach the topic labels.
stopwords =

# Parts-of-speech to keep: specify which parts of speach to keep. Use notation from Spacy model used, see https://spacio.io/models
# Separate each pos to keep by a comma
# Requires a language model to be set
pos_to_keep =

# Named entities to keep: specify which named entities to keep. Use notation from Spacy model used, see https://spacio.io/models
# Separate each entity to keep by a comma
# Requires a language model to be set
ner_to_keep =

# Dictionary file. Only keep words in dictionary file. Useful when dealing with OCR errors. Assumes lemmatization.
dictionary =


[VECTORIZATION]
#
# The single most important section for bertopic topic quality.
#
# With bertopic the vectorizer does not produce the document representation --
# the embeddings do. It supplies the vocabulary that c-TF-IDF uses to describe
# each cluster. c-TF-IDF works by elevating terms concentrated in one cluster,
# so it needs distinctive, moderately rare words to have anything to say.
#
# The NMF template's `min_freq = 0.1` keeps only terms appearing in at least
# 10% of documents. NMF tolerates that because it learns discriminative
# weights inside whatever band it is handed. c-TF-IDF cannot: a 10% floor
# deletes precisely the cluster-specific vocabulary it depends on, and every
# topic ends up described by the same generic high-frequency words.
#
# Measured on a 3000-document Zipfian corpus:
#     min_freq = 0.1  ->    200 terms
#     min_freq = 0.02 ->    991 terms
#     min_freq = 5    ->  11748 terms
#
# Values above 1 are read as an absolute document count; values in [0, 1] as a
# proportion of the corpus. Use a count here.

# Vectorization type: choice between tf (Term Frequency), and tfidf (Term Frequency - Inverse Document Frequency).
# tf for bertopic: c-TF-IDF applies its own BM25 weighting on top, and raw
# counts also make the web app's word co-occurrence table easier to reason about.
vectorization = tf

# Minimum frequency of token. An integer (>1) means "appears in at least N
# documents"; a decimal means a proportion of the corpus.
# 5 is a reasonable starting floor. Raise it on very large corpora, where it
# is also the main lever on the vocabulary size capped by max_features below.
min_freq = 5

# Maximum frequency of token: proportion of the corpus, above which a term is
# dropped. c-TF-IDF already damps frequent words (BM25 + sqrt TF), so this can
# stay permissive; its job is just to remove terms that are in nearly every
# document and therefore cannot distinguish topics.
max_freq = 0.8

# Max features: keep only the top N terms by corpus frequency.
#
# NOT optional for bertopic. Building the web app computes two dense
# vocabulary x vocabulary similarity matrices (DB.py, save_words), so memory
# grows with the SQUARE of the vocabulary:
#     10000 terms ->  1.6 GB peak
#     15000 terms ->  3.6 GB peak
#     20000 terms ->  6.4 GB peak
#     50000 terms -> 40.0 GB peak
# An absolute min_freq on a large corpus easily reaches 50k+ terms, so this
# cap is what keeps the build from exhausting RAM. Lower it if the machine is
# small; raise it if you have headroom and want finer topic labels.
max_features = 15000

# Defines how many tokens constitute a ngram
ngram = 1


[TOPIC_MODELING]
# SBERT + UMAP + HDBSCAN + c-TF-IDF.
algorithm = bertopic

# Leave EMPTY for bertopic. The topic count is a property of the clustering,
# not an input to it: HDBSCAN finds as many well-separated groups as the
# embedding space supports, and min_cluster_size below is how you steer that.
#
# Setting an integer here instead forces agglomerative reduction, which
# repeatedly merges the most similar pair of topics. The largest cluster sits
# nearest the corpus centroid, so it wins merges and snowballs -- one of the
# main causes of a single oversized topic. "auto" is a gentler middle ground
# that merges only clearly redundant topics.
number_of_topics =

# Not used by bertopic (nothing here iterates to convergence). Leave empty.
max_iter =


# --- bertopic settings ------------------------------------------------------
# Any value left empty falls back to the model default shown in brackets.
# The defaults are good starting points; tune min_cluster_size first.

# Sentence-transformer model used to embed documents. Must suit the corpus
# language. The default is multilingual with an 8192-token context window, so
# whole documents usually embed as a single chunk.
# [Alibaba-NLP/gte-multilingual-base]
embedding_model =

# Smallest group of documents HDBSCAN will call a topic. THE main tuning knob:
# raise it for fewer, broader topics; lower it for more, finer ones.
# Empty scales it with corpus size (0.2%, floor 10), since a fixed value means
# something very different at 5k documents than at 500k. []
min_cluster_size =

# HDBSCAN cluster selection: leaf or eom. "eom" (excess of mass) structurally
# prefers a few large clusters and is a known cause of one mega-topic; "leaf"
# yields more, smaller, comparable topics. [leaf]
cluster_selection_method =

# Reassign HDBSCAN outliers (often 30-50% of a text corpus) to their nearest
# topic centroid, so their vocabulary reaches c-TF-IDF instead of being
# discarded. [true]
reduce_outliers =

# Softmax temperature converting doc-to-centroid cosine similarity into the
# topic distribution. Lower is peakier (approaching one topic per document),
# higher is flatter. Leave empty to calibrate it from the data, which is
# strongly recommended: the useful value depends on how wide the cosine
# spread of the chosen embedding model is, so a fixed number that gives good
# mixed membership on one corpus goes near one-hot on another. The calibrated
# value and the resulting entropy are printed at fit time. [auto]
assignment_temperature =

# Diversify displayed topic words to suppress near-duplicates
# (homme/hommes/humanite). 0 disables; ~0.3 is a reasonable starting point.
# Off by default: it re-orders top_words without re-ordering their weights, so
# the word_distribution bar chart stops being monotonic. [0.0]
mmr_diversity =

# Batch size for the embedding pass. Lower it if the GPU runs out of memory.
# [32]
embedding_batch_size =


[TOPICS_OVER_TIME]
# DEFAULT display bucket (in years) for the topic-evolution charts in the web
# UI. Storage is always at 1-year resolution — this field only sets the UI's
# starting value. Users can change the bucket size live from each topic page
# (Bucket (yrs) control in the "correlated topics" card). Typical values:
#   1   (raw yearly data — noisy for century-scale corpora)
#   10  (decade buckets — usually the sweet spot)
#   25, 50, 100 (broad trend views)
topics_over_time_interval = 10

# Define start and end date. If not set, topologic will use the lowest and highest values in the collection
start_date =
end_date =


[TOPIC_LABELING]
# Enable LLM-based labeling: when true, every topic gets a short human-readable
# label generated from its top words. Requires the chosen model to be loadable
# via `transformers.pipeline` (downloaded from HuggingFace on first use).
# When false (default), topics fall back to their comma-separated top-word list.
enabled = false

# HuggingFace model ID. Must be instruction-tuned.
model = google/gemma-4-E2B-it

# Target language for the generated labels. Free text passed into the system
# prompt, e.g. "English", "French", "Spanish".
language = English
