###############################################
## TOPOLOGIC CONFIGURATION FILE ##
###############################################
#
# One template for every backend. Set TOPIC_MODELING/algorithm, then fill in
# that backend's own section if it has one:
#
#   nmf       classic NMF over word counts            no extra section
#   lda       latent Dirichlet allocation             no extra section
#   bertopic  SBERT + UMAP + HDBSCAN + c-TF-IDF       BERTOPIC section
#
# An unused backend section is ignored, so it can stay in the file.
# Values left empty fall back to the default shown in brackets.

[TRAINING_DATA]
# Comma-separated list of text source paths. Each entry is either:
#   - the root of an existing philologic database (detected automatically), or
#   - a directory of raw TEI/plaintext files to be parsed in place.
# For raw input, drop an optional bibliography.tsv/.csv next to (or inside)
# the directory — all columns flow through as metadata. Without a bibliography,
# TEI headers are used. The 'filename' column is required in the bibliography.
text_paths =

# Defines what object level to divide each text into. Useful to break up a single document into smaller text units. If several, use a comma to distinguish each. Must be in same order as the path
text_object_level =

# Minimum tokens per doc for training. If 0 is set, training data will include the entire corpus.
min_tokens_per_doc = 0

# Maximum chunk size, in RAW words (not preprocessed tokens; the two differ by
# roughly 5x). A chunk never spans more than one text object, so a small object
# yields a single chunk. Paragraphs are never split, so a longer one becomes an
# over-size chunk of its own. Empty means one chunk per text object.
max_chunk_size =


[INFERENCE_DATA]
# Comma-separated list of text source paths (same rules as TRAINING_DATA).
text_paths =

# Optional link to an external Philologic web app to cite from inside the
# TopoLogic UI (one URL per path in text_paths, in order). Leave blank for
# corpora parsed from raw files or when no linked web app exists.
philologic_database_urls =

# Defines what object level to divide each text into. Useful to break up a single document into smaller text units. If several, use a comma to distinguish each. Must be in same order as the path
text_object_level =

# Minimum tokens per doc for inference. If 0 is set, the model will be applied to the entire corpus. If set to above 0, only documents above the threshold will be classified and stored in the databse.
min_tokens_per_doc = 0

# Maximum chunk size, in RAW words (not preprocessed tokens; the two differ by
# roughly 5x). A chunk never spans more than one text object, so a small object
# yields a single chunk. Paragraphs are never split, so a longer one becomes an
# over-size chunk of its own. Empty means one chunk per text object.
max_chunk_size =


[METADATA_FILTERS]
### List one metadata field and one value per line, e.g. author = Rousseau
### The value for the query must use the PhiloLogic metadadata query syntax
### So egrep-style regexes as well as ranges are admissible, as well as NOT or OR queries


[DATABASE]
# Name of database. Must be without spaces. Use underscores to separate words (no hyphens)
database_name =

[PREPROCESSING]

# Language: set the language for various normalization tasks
# such as stemming, lemmatizing, word mapping...etc
language =

# Language model: specify a Spacy Language model for PoS or NER filtering. See https://spacy.io/models
language_model =

# Modernize language if modernization is available for your language: currently only French is supported.
modernize = yes

# Transliterate characters to closest ascii representation.
ascii = no

# Stem words using the Porter Stemmer
stemmer = yes

# Lemmatizer: path to lemmatizer file where each line contains the inflected form and
# the corresponding lemma separated by a tab
lemmatizer =

# Lowercase words
lowercase = yes

# Remove numbers
numbers = yes

# Minimum word length
minimum_word_length = 2

# Stopwords: path to stopword list
stopwords =

# Parts-of-speech to keep: specify which parts of speach to keep. Use notation from Spacy model used, see https://spacio.io/models
# Separate each pos to keep by a comma
# Requires a language model to be set
pos_to_keep =

# Named entities to keep: specify which named entities to keep. Use notation from Spacy model used, see https://spacio.io/models
# Separate each entity to keep by a comma
# Requires a language model to be set
ner_to_keep =

# Dictionary file. Only keep words in dictionary file. Useful when dealing with OCR errors. Assumes lemmatization.
dictionary =

[VECTORIZATION]
# Settings here matter more for some backends than others, and the good values
# differ. Recommended starting points:
#
#              vectorization  min_freq  max_freq  max_features
#   nmf / lda      tfidf         0.1       0.9       (empty)
#   bertopic        tf            5        0.8        15000
#
# bertopic needs an absolute count rather than a proportion, because c-TF-IDF
# works by elevating terms concentrated in one cluster and a proportional floor
# deletes exactly that vocabulary.

# tf (Term Frequency) or tfidf. Use tf for bertopic — c-TF-IDF applies its own
# weighting on top.
vectorization = tfidf

# Minimum frequency of token. A decimal in [0, 1] is a proportion of the
# corpus; an integer above 1 is an absolute document count.
min_freq = 0.1

# Maximum frequency of token, same units as min_freq.
max_freq = 0.9

# Keep only the top N terms by corpus frequency. Empty keeps all.
#
# NOT optional for bertopic: building the web app computes two dense
# vocabulary x vocabulary matrices, so memory grows with the SQUARE of the
# vocabulary (10k terms -> 1.6 GB, 20k -> 6.4 GB, 50k -> 40 GB).
max_features =

# Defines how many tokens constitute a ngram
ngram = 1


[TOPIC_MODELING]
# nmf, lda or bertopic. See the header.
algorithm = nmf

# Number of topics.
#   nmf, lda   a positive integer, required.
#   bertopic   leave EMPTY. The count is a property of the clustering; steer it
#              with min_cluster_size. An integer forces agglomerative reduction,
#              which snowballs into one oversized topic.
number_of_topics = 100

# Maximum iterations. Required for nmf/lda; unused by bertopic, which has
# nothing that iterates to convergence.
max_iter = 200


[BERTOPIC]
# Only read when algorithm = bertopic. Tune min_cluster_size first.

# Sentence-transformer used to embed documents. Must suit the corpus language.
# [Alibaba-NLP/gte-multilingual-base]
embedding_model =

# Smallest group HDBSCAN will call a topic. Raise for fewer, broader topics.
# Counts CHUNKS, not documents, so a value tuned before chunking is far too
# small. A decimal in [0, 1] is a proportion of chunks instead, which is worth
# using on a large corpus — an absolute count makes the topic count grow with
# the corpus. [10]
min_cluster_size =

# leaf or eom. The strongest granularity knob: "leaf" gives many small topics,
# "eom" markedly fewer and broader — but eom is also what produces a single
# oversized topic when the corpus has one dominant theme. [leaf]
cluster_selection_method =

# Merge clusters closer than this. A direct "stop splitting" knob; try 0.1-0.3
# to collapse over-fine topics. [0.0]
cluster_selection_epsilon =

# UMAP neighbourhood size. Higher gives fewer, broader topics; try 30-50 if
# topics are too fine-grained. [15]
umap_neighbors =

# Reassign HDBSCAN outliers (often 30-50% of a text corpus) to their nearest
# topic centroid so their vocabulary reaches c-TF-IDF. [true]
reduce_outliers =

# Softmax temperature turning doc-to-centroid similarity into the topic
# distribution. Leave empty to calibrate from the data: the useful value depends
# on the embedding model's cosine spread, so a fixed number that works on one
# corpus goes near one-hot on another. [auto]
assignment_temperature =

# Diversify displayed topic words to suppress near-duplicates; ~0.3 to enable.
# Off by default: it re-orders words without re-ordering their weights, so the
# word_distribution chart stops being monotonic. [0.0]
mmr_diversity =

# Lower if the GPU runs out of memory. [32]
embedding_batch_size =


[TOPICS_OVER_TIME]
# DEFAULT display bucket (in years) for the topic-evolution charts in the web
# UI. Storage is always at 1-year resolution — this field only sets the UI's
# starting value. Users can change the bucket size live from each topic page
# (Bucket (yrs) control in the "correlated topics" card). Typical values:
#   1   (raw yearly data — noisy for century-scale corpora)
#   10  (decade buckets — usually the sweet spot)
#   25, 50, 100 (broad trend views)
topics_over_time_interval = 10

# Define start and end date. If not set, topologic will use the lowest and highest values in the collection
start_date =
end_date =


[TOPIC_LABELING]
# Enable LLM-based labeling: when true, every topic gets a short human-readable
# label generated from its top words. Requires the chosen model to be loadable
# via `transformers.pipeline` (downloaded from HuggingFace on first use).
# When false (default), topics fall back to their comma-separated top-word list.
enabled = false

# HuggingFace model ID. Must be instruction-tuned.
model = google/gemma-4-E2B-it

# Target language for the generated labels. Free text passed into the system
# prompt, e.g. "English", "French", "Spanish".
language = English