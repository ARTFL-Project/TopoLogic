[WEB_APP]
# Location of TopoLogic web applications (one is create for each database)
web_app_path = /var/www/html/topologic
# Root URL path of web application. This is used to create the URL for the web application
server_name = localhost
# Proxy path: if running topologic behind a proxy, define path and/or port to get to the TopoLogic instance
proxy_path =

# Storage is DuckDB; each model owns its own file (<web_app_path>/<model>/model.duckdb).
# No database server or credentials required.
