[project]
name = "topologic"
version = "0.4"
description = "Yet Another Topic Modeling Browser"
authors = [
    { name = "The ARTFL Project", email = "clovisgladstone@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "scikit-learn",
    "pandas>=2.3,<3",
    "scipy",
    "numpy",
    "tqdm",
    "joblib",
    "matplotlib",
    "fastapi==0.110.3",
    "gunicorn",
    "uvicorn",
    "uvloop",
    "httptools",
    "annoy",
    "duckdb>=1.1",
    "lz4",
    "multiprocess",
    "text_preprocessing",
    "philologic>=5.2.2.1",
    "spacy-transformers",
    "bertopic>=0.16",
    "sentence-transformers",
]

# Install-time backend choice. Exactly one of these extras must be passed to
# `uv sync` (install.sh resolves it from the --cpu/--cuda flag). `cuda` adds
# cupy-cuda12x (spacy GPU array ops). For GPU UMAP/HDBSCAN with BERTopic,
# install cuml-cu12 separately (`pip install --extra-index-url
# https://pypi.nvidia.com cuml-cu12`); BERTopicModel auto-detects it at
# runtime and falls back to the CPU implementations otherwise.
[project.optional-dependencies]
cpu = ["torch>=2.5"]
cuda = ["torch>=2.5", "cupy-cuda12x"]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cuda" }],
]

[tool.uv.sources]
text_preprocessing = { git = "https://github.com/ARTFL-Project/text-preprocessing", tag = "v1.1.2" }
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["topologic*"]
