[project]
name = "topologic-labeler"
version = "0.1"
description = "Isolated LLM-based topic labeler for TopoLogic. Installed in its own venv so it can pin a newer `transformers` without conflicting with the main topologic package's `spacy-transformers` ceiling."
authors = [
    { name = "The ARTFL Project", email = "clovisgladstone@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.56",
    "accelerate>=0.26.0",
    "tqdm",
]

# Install-time backend choice. Exactly one of these extras must be passed to
# `uv sync` (install.sh resolves it from the --cpu/--cuda flag).
[project.optional-dependencies]
cpu = ["torch"]
cuda = ["torch"]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cuda" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[project.scripts]
topologic-labeler = "topologic_labeler.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["topologic_labeler*"]
