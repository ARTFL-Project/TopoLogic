RewriteEngine On
RewriteRule ^/?$ dist/ [PT,QSA]

# Vite layout (current builds): everything under dist/assets/
RewriteRule ^assets/(.*) dist/assets/$1 [L]
RewriteRule ^favicon\.ico$ dist/favicon.ico [L]

# Vue CLI layout (legacy builds): dist/css/ and dist/js/
RewriteRule ^css/(.*) dist/css/$1 [L]
RewriteRule ^js/(.*) dist/js/$1 [L]

# SPA routes fall back to the built index.html.
RewriteRule ^topic dist/ [L]
RewriteRule ^word dist/ [L]
RewriteRule ^document dist/ [L]
RewriteRule ^vocabulary dist/ [L]
RewriteRule ^time dist/ [L]
RewriteRule ^view dist/ [L]
RewriteRule ^metadata dist/ [L]
